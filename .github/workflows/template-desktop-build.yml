# Packages one Desktop target as an unsigned installer and uploads workflow
# artifact `desktop-installer-<target>`. The caller owns versioning and publication.
name: Desktop build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to package; the llama.cpp worker is built from the same commit.
        type: string
        required: true
      target:
        description: Desktop package target (mac-arm64, mac-x64, win-x64 or linux-x64).
        type: string
        required: true
      build_version:
        description: Desktop build version; empty packages the product version.
        type: string
        default: ''
        required: false

permissions:
  contents: read

jobs:
  llama-worker:
    uses: ./.github/workflows/llama-worker.yml
    with:
      ref: ${{ inputs.ref }}
      targets: >-
        ${{ inputs.target == 'mac-arm64' && 'macos-arm64'
            || inputs.target == 'mac-x64' && 'macos-x64'
            || inputs.target == 'win-x64' && 'windows-x64'
            || inputs.target == 'linux-x64' && 'linux-x64'
            || 'unsupported' }}

  package:
    name: Package (${{ inputs.target }})
    needs: llama-worker
    # The same runner images as llama-worker.yml, so the worker and the
    # application share their OS floor; Linux builds on 22.04 for glibc 2.35.
    runs-on: >-
      ${{ inputs.target == 'mac-arm64' && 'macos-15'
          || inputs.target == 'mac-x64' && 'macos-15-intel'
          || inputs.target == 'win-x64' && 'windows-2025'
          || 'ubuntu-22.04' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ inputs.target }}
      BUILD_VERSION: ${{ inputs.build_version }}
      WORKER_TARGET: >-
        ${{ inputs.target == 'mac-arm64' && 'macos-arm64'
            || inputs.target == 'mac-x64' && 'macos-x64'
            || inputs.target == 'win-x64' && 'windows-x64'
            || 'linux-x64' }}
      JAN_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.1
        with:
          name: jan-llama-worker-${{ env.WORKER_TARGET }}
          path: ${{ runner.temp }}/llama-worker
      - name: Stage the llama.cpp worker built from this checkout
        env:
          LLAMA_WORKER_ARTIFACT: ${{ runner.temp }}/llama-worker
          SOURCE_COMMIT: ${{ steps.checkout.outputs.commit }}
        run: |
          built=$(cat "$LLAMA_WORKER_ARTIFACT/source-commit")
          if [[ "$built" != "$SOURCE_COMMIT" ]]; then
            echo "::error::jan-llama-worker was built from $built, but this package checks out $SOURCE_COMMIT"
            exit 1
          fi
          rm -rf native/llama-worker/dist
          mkdir -p native/llama-worker/dist
          tar -xzf "$LLAMA_WORKER_ARTIFACT/jan-llama-worker-$WORKER_TARGET.tar.gz" -C native/llama-worker/dist
      # The Linux addon payload links its musl helpers with musl-gcc, which clean Ubuntu runners lack.
      - name: Install the musl toolchain
        if: inputs.target == 'linux-x64'
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - name: Build the unsigned installer
        run: |
          args=("$TARGET" --unsigned)
          if [[ -n "$BUILD_VERSION" ]]; then args+=(--build-version "$BUILD_VERSION"); fi
          pnpm --dir apps/desktop run package "${args[@]}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: desktop-installer-${{ inputs.target }}
          include-hidden-files: true
          path: |
            apps/desktop/.desktop-build/targets/${{ inputs.target }}/unsigned-artifacts/*.dmg
            apps/desktop/.desktop-build/targets/${{ inputs.target }}/unsigned-artifacts/*.exe
            apps/desktop/.desktop-build/targets/${{ inputs.target }}/unsigned-artifacts/*.AppImage
            apps/desktop/.desktop-build/targets/${{ inputs.target }}/unsigned-artifacts/*.deb
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7.0.1
        if: failure() && steps.checkout.outcome == 'success'
        with:
          name: packaging-logs-${{ inputs.target }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: ignore
          retention-days: 14
