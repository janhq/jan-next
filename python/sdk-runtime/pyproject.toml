[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "jan-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled jan CLI runtime for the Jan Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jan" }]

[project.urls]
Homepage = "https://github.com/janhq/jan-next"
Documentation = "https://github.com/janhq/jan-next/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/janhq/jan-next/issues"
Source = "https://github.com/janhq/jan-next"

[project.scripts]
jan = "jan_runtime:main"

# Include the injected jan executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = [
  "src/jan_runtime/runtime/jan-sdk-runtime-*",
  "src/jan_runtime/runtime/jan-sdk-runtime-*/**",
  "src/jan_runtime/runtime/linux-*/**",
  "src/jan_runtime/runtime/macos-*/**",
  "src/jan_runtime/runtime/win-*/**",
]
exclude = ["src/jan_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/jan_runtime"]
# The release job uses Twine 6.2.0, which accepts core metadata through 2.4.
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
