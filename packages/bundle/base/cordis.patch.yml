# The jan-base bundle patch: the shared core of each base-backed profile, applied as
# ONE insert over the empty profile root. Later bundle patches and the user's
# profile cordis.patch.yml address these rows by id, with the last write
# winning per row.
#
# A patch replaces the targeted row's whole `config` rather than merging into
# it, so a row whose value differs by mode does NOT live here: it belongs to
# each mode bundle, keeping any single row down to one bundle layer plus the
# user's. Mode-specific rows appear below only with shared plugin identity and
# neutral defaults; each mode bundle restates its complete configuration.
#
# Row order carries no load semantics (activation is service-availability
# driven); the grouping is for readers.

- insert:
    - id: tool-plugin-manager
      name: '@janhq/jan-plugin-manager/tools'
      disabled: true

    # tokamak-harness: install plugins from the public npm registry only (no npmmirror fallback).
    - id: plugin-manager
      name: '@janhq/jan-plugin-manager'
      disabled: !!js "!ctx.get('profileContext')"
      config:
        registry: https://registry.npmjs.org/
        fallbackRegistries: []

    - id: timer
      name: '@janhq/cordis-plugin-timer'

    # Profile configuration reloads by default; module roots are opt-in.
    - id: hmr
      name: '@janhq/jan-hmr'
      disabled: !!js "!ctx.get('profileContext')"
      config:
        root: []

    - id: llm
      name: '@janhq/jan-llm'

    - id: session
      name: '@janhq/jan-session'

    - id: typert
      name: '@janhq/jan-typert-registry'

    - id: typert-loader
      name: '@janhq/jan-typert-loader'

    - id: typert-gateway
      name: '@janhq/jan-api-gateway'

    # Method-level access control for non-owner Peers; the Gateway requires it,
    # and its Client half publishes the standard access Hooks.
    - id: remote-access
      name: '@janhq/jan-api-remote-access'

    - id: session-title
      name: '@janhq/jan-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: session-title-llm
      name: '@janhq/jan-session-title-first-prompt-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        # A ceiling against runaway output, not a length target: the prompt
        # keeps titles short, while reasoning a model cannot switch off also
        # counts as output. Stays within common model output limits.
        maxOutputTokens: 4096
        timeoutMs: 60000

    - id: user-questions
      name: '@janhq/jan-user-questions'

    - id: agent
      name: '@janhq/jan-agent'

    # The transport-independent default for Agents created by entry points.
    # Settings may supply a saved selection; consumers read it at creation time.
    - id: agent-default-model
      name: '@janhq/jan-agent-default-model'
      config:
        # tokamak-harness: default to the Tokamak router's automatic model (llm-pi-ai
        # `tokamak` route below). When the router does not list the saved default, the
        # route moves it to a listed model (`modelListing.preferredDefaults`).
        provider: tokamak
        model: tokamak/auto

    - id: jobs
      name: '@janhq/jan-jobs-local'

    - id: llm-retry
      name: '@janhq/jan-llm-retry'

    # Jan: continue a rate-limited, out-of-quota or refused reply on the next
    # model the user listed in Settings > Models; empty chain = off.
    - id: model-fallback
      name: '@janhq/jan-llm-fallback'

    # Live Config forms persist through the active profile patch.

    # Live configuration forms persist through the launcher's profile.
    - id: config-editor
      name: '@janhq/jan-config-editor'
      disabled: !!js "!ctx.get('profileContext')"

    - id: settings
      name: '@janhq/jan-settings'
      disabled: !!js "!ctx.get('profileContext')"

    # Credential sources: managed `$JAN_HOME/.credentials.yaml`, then inherited
    # environment, project `.env`, and user `.env` fallbacks.
    # Adapters resolve references per request; the Models page writes only the
    # managed document, which is never materialized into the process environment.
    - id: authorization
      name: '@janhq/jan-authorization'

    # tokamak-harness: the account seam is served by Tokamak's CLI device sign-in.
    # The minted key is stored as a grant record and as the TOKAMAK_API_KEY
    # credential the `tokamak` model route reads. TOKAMAK_BASE_URL / TOKAMAK_WEB_URL
    # point it at another deployment (e.g. https://api-stag.tokamak.sh); a bare
    # host gets /v1, identically for this row and the model route.
    - id: tokamak-account
      name: '@janhq/jan-tokamak-account'
      config:
        apiBaseURL: !!js (process.env.TOKAMAK_BASE_URL || 'https://api.tokamak.sh/v1').trim().replace(/\/+$/, '').replace(/^(https?:\/\/[^/]+)$/, '$1/v1')
        webOrigin: !!js process.env.TOKAMAK_WEB_URL || ''
        allowLoopbackHttp: !!js "['1', 'true', 'yes'].includes((process.env.TOKAMAK_ALLOW_LOOPBACK_HTTP ?? '').toLowerCase())"
        clientName: Jan Next

    - id: credentials
      name: '@janhq/jan-credentials-local'

    # The pi-ai multi-provider twin, mounted dormant: zero routes (and no extra
    # models in the picker) until a `llm-pi-ai:` settings section supplies provider
    # profiles — then those routes register live, keys resolving per request
    # through their apiKeyEnv references, and drop again when the section empties.
    # Supplying those profiles is exactly what the web Models page does. Which
    # adapters exist is composition; which providers run is the user's settings
    # document.
    - id: llm-pi-ai
      name: '@janhq/jan-llm-pi-ai'
      config:
        providers:
          # tokamak-harness: Tokamak router, OpenAI-compatible, keyed by the
          # TOKAMAK_API_KEY credential that Tokamak sign-in writes (or the env var).
          # The router decides which models it serves: the route lists them from
          # GET {baseURL}/models at startup, after sign-in, and every refreshIntervalMs,
          # and offers none while signed out or before the first listing succeeds; the
          # last listing is kept in storage and served after a restart until the launch
          # refresh replaces it.
          tokamak:
            displayName: Tokamak
            api: openai-completions
            baseURL: https://api.tokamak.sh/v1
            apiKeyEnv: TOKAMAK_API_KEY
            # Used only for a listed model whose listing reports no context_length.
            defaultContextWindow: 200000
            modelListing:
              refreshIntervalMs: 600000
              timeoutMs: 15000
              preferredDefaults: [tokamak/auto]
              # The router lists image generation models without marking them as non-chat.
              exclude: [openai/gpt-image-*]
            # The router's listing reports input modalities only for some models, and
            # an undeclared model would default to text only, so its Claude, GPT and
            # Gemini chat models could not read images. Models the router serves read
            # images unless named below as text only; an entry that declares
            # `architecture.input_modalities` still answers for itself.
            defaultInput: [text, image]
            models:
              - id: deepseek-flash
                input: [text]
              - id: deepseek-v4-pro
                input: [text]
              - id: openai/gpt-oss-120b-medium
                input: [text]
          # tokamak-harness: the managed local model (web-app row `llama-cpp`). Its key and
          # endpoint (the worker's OS-assigned port) exist only while that worker runs, so
          # otherwise the route offers no models.
          local:
            displayName: Local (llama.cpp)
            api: openai-completions
            baseURLEnv: LLAMA_CPP_BASE_URL
            apiKeyEnv: LLAMA_CPP_API_KEY
            # A CPU-only machine can take minutes to read the harness's ~12k-token
            # prompt before the first token; wait instead of retrying from scratch.
            streamIdleTimeoutMs: 1800000
            models:
              # The llama-cpp row serves whichever model is in use under this id and keeps
              # the name equal to it through the llm-pi-ai settings section.
              - id: local
                name: Jan v3.5 4B (local)
                # The llama-cpp row's ctxSize (32768) until it writes the context the worker serves.
                contextWindow: 32768
                maxTokens: 8192

    - id: session-persistence-jsonl
      name: '@janhq/jan-session-persistence-jsonl'
      config:
        root: !!js janHomePath('sessions')

    # Durable image bytes live outside the append-only session log. Messages
    # keep content-addressed references that this shared backend resolves for
    # provider requests and authorized history reads.
    - id: attachment-local
      name: '@janhq/jan-attachment-local'

    # Full-text session search is opt-in. `openAt: never` keeps
    # ctx.sessionQuery mounted — exact reads, titles, and lineage traces
    # (session export, subagent-fork Workspace inheritance) stay available —
    # while search calls fail with SESSION_QUERY_SEARCH_DISABLED and SQLite is
    # never opened; the Web sidebar search matches titles and workspace names
    # only. Deployments enabling content search override `openAt` to
    # `first-search` or `startup` in a later patch layer (profile
    # cordis.patch.yml or a --patch overlay), typically with a durable `path`.
    - id: session-query-sqlite
      name: '@janhq/jan-session-query-sqlite'
      config:
        path: ':memory:'
        openAt: never

    # Shared projection registry: subagent catalog identity (mode/label) folds
    # through its registered units, so the `list_agents` surface below fails
    # loud without it; web layers reuse this same mount for list rows.
    - id: working-directory
      name: '@janhq/jan-working-directory'

    - id: tool-working-directory
      name: '@janhq/jan-tool-working-directory'

    - id: session-projection
      name: '@janhq/jan-session-projection'

    # Durable KV storage: the storage hub, the json backend, and the
    # schema-validated domain form over them. Session-layer persistence (the
    # projection cache below; workspace in web layers)
    # routes through this stack, so it belongs to the shared base.
    - id: storage
      name: '@janhq/jan-storage'

    - id: storage-json
      name: '@janhq/jan-storage-json'
      config:
        root: !!js janHomePath('storages')

    - id: storage-domain
      name: '@janhq/jan-storage-domain'
      config:
        backend: json

    # Persisted projection cache: throttled write-behind over the
    # session_projcache domain (per-record layout — one version-stamped
    # checkpoint document per session), serving the session listing's
    # projection column.
    - id: session-projection-cache
      name: '@janhq/jan-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    # tokamak-harness: no exporter consumes OTel channels, so the service is not mounted.
    - id: otel
      name: '@janhq/jan-otel'
      disabled: true

    # OTel releases a Session-log prefix only after explicit user feedback,
    # regardless of model provider. Ordinary activity never triggers capture.
    # JAN_TELEMETRY_OTLP_URL supplies the collector endpoint; enabling the row
    # without it fails at load. A non-empty
    # JAN_TELEMETRY_DISABLED — any value, including '0'/'false' — opts the
    # process out (the launchers patch the row disabled; config cannot disable
    # a row). Exports carry the harness home's anonymous user id ($JAN_HOME/.anonymous-user-id,
    # random UUID; delete the file to reset the identity) as the Resource's
    # user.id. Byte-bounded batching may turn an authorized prefix into
    # several HTTP requests. Requests run serially; each has its own 1s
    # transport timeout and 1.5s watchdog. A watchdog does not release the
    # active request slot. The outer 3s shutdown deadline stops queued sends;
    # large prefixes or an unsettled transport may leave records unsent.
    # Every CLI exit path drains by disposing the root on SIGINT/SIGTERM.
    # tokamak-harness: telemetry is off.
    - id: session-telemetry-otel
      name: '@janhq/jan-session-telemetry-otel'
      disabled: true
      config:
        mode: !!js process.env.JAN_TELEMETRY_MODE || 'FEEDBACK_ONLY'
        shutdownTimeoutMillis: 3000
        maxRequestBytes: 4000000
        exporter:
          url: !!js process.env.JAN_TELEMETRY_OTLP_URL
          compression: gzip
          timeoutMillis: 1000
        processor:
          scheduledDelayMillis: 10000
          maxQueueSize: 2048
          maxExportBatchSize: 2048
          exportTimeoutMillis: 1500

    - id: subprocess
      name: '@janhq/jan-subprocess-local'

    # Every shipped CLI mode starts with the same file-effect boundary.
    # The environment remains an explicit deployment override; otherwise fresh
    # sessions pin workspace-write + ask through the permission service below.
    - id: sandbox
      name: '@janhq/jan-sandbox-local'

    - id: sandbox-policy
      name: '@janhq/jan-sandbox-policy'
      config:
        mode: !!js process.env.JAN_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.cwd()

    - id: bash-sandbox
      name: '@janhq/jan-bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000

    - id: pwsh-sandbox
      name: '@janhq/jan-pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'

    - id: approval
      name: '@janhq/jan-user-approval'
      config:
        policy: !!js "(process.env.JAN_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

    - id: permission
      name: '@janhq/jan-permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

    - id: shell-env
      name: '@janhq/jan-shell-env'

    - id: tool-bash
      name: '@janhq/jan-tool-bash'
      disabled: !!js process.platform === 'win32'

    - id: tool-pwsh
      name: '@janhq/jan-tool-pwsh'
      disabled: !!js process.platform !== 'win32'

    - id: tool-jobs
      name: '@janhq/jan-tool-jobs'

    - id: fs-observation-policy
      name: '@janhq/jan-fs-observation-policy'
      disabled: true

    - id: tool-fs
      name: '@janhq/jan-tool-fs'
      config:
        # Set false to drop the apply_patch tool beside edit.
        applyPatch: false

    - id: tool-fs-search
      name: '@janhq/jan-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: agent-instructions
      name: '@janhq/jan-agent-instructions'
      config:
        maxBytes: 65536

    - id: skill
      name: '@janhq/jan-skill'

    - id: skill-filesystem
      name: '@janhq/jan-skill-filesystem'

    - id: tool-skill
      name: '@janhq/jan-tool-skill'

    - id: commands
      name: '@janhq/jan-commands'

    - id: command-feedback
      name: '@janhq/jan-command-feedback'

    - id: goal
      name: '@janhq/jan-goal'

    - id: goal-round-driver
      name: '@janhq/jan-goal-round-driver'

    - id: command-goal
      name: '@janhq/jan-command-goal'

    - id: plan-mode
      name: '@janhq/jan-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed only to keep the request shape stable. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

    - id: token-meter
      name: '@janhq/jan-token-meter'

    - id: compaction-basic
      name: '@janhq/jan-compaction-basic'

    # Human `/compact`: one useful reduction below the automatic threshold. Backend
    # independent, so it follows whichever compaction service this leaf mounts.
    - id: command-compact
      name: '@janhq/jan-command-compact'

    - id: subagent
      name: '@janhq/jan-subagent'

    # tokamak-harness: first-class fresh delegation roles in every base profile.
    - id: agent-preset-registry
      name: '@janhq/jan-agent-preset-registry'
      config:
        default: worker

    - id: preset-scout
      name: '@janhq/jan-agent-preset'
      config:
        id: scout
        description: Read-only repository discovery; fast, inexpensive model.
        toolAllowlist: [read, read_image, glob, grep, send_message, wait_agent, list_agents]
        plugins:
          - id: tool-fs
            name: '@janhq/jan-tool-fs'
            config: { write: false, edit: false, applyPatch: false }
          - id: tool-fs-search
            name: '@janhq/jan-tool-fs-search'
            config: { sampleOverCapGlobResults: false }
          - id: tool-subagent-control
            name: '@janhq/jan-tool-subagent-control'
            config: { interrupt: false }

    - id: preset-reviewer
      name: '@janhq/jan-agent-preset'
      config:
        id: reviewer
        description: Read-only diff review and tests that do not write files.
        toolAllowlist: [read, read_image, glob, grep, bash, pwsh, job_output, job_kill, send_message, wait_agent, list_agents]
        readOnlyDelegation: true
        plugins:
          - id: tool-fs
            name: '@janhq/jan-tool-fs'
            config: { write: false, edit: false, applyPatch: false }
          - id: tool-fs-search
            name: '@janhq/jan-tool-fs-search'
            config: { sampleOverCapGlobResults: false }
          - id: tool-bash
            name: '@janhq/jan-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@janhq/jan-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-jobs
            name: '@janhq/jan-tool-jobs'
          - id: tool-subagent-control
            name: '@janhq/jan-tool-subagent-control'
            config: { interrupt: false }

    - id: preset-worker
      name: '@janhq/jan-agent-preset'
      config:
        id: worker
        description: Implement changes with read, shell, and full file editing tools.
        plugins:
          - id: tool-fs
            name: '@janhq/jan-tool-fs'
            config: { applyPatch: true }
          - id: tool-fs-search
            name: '@janhq/jan-tool-fs-search'
            config: { sampleOverCapGlobResults: false }
          - id: tool-bash
            name: '@janhq/jan-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@janhq/jan-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-jobs
            name: '@janhq/jan-tool-jobs'
          - id: tool-subagent-control
            name: '@janhq/jan-tool-subagent-control'

    - id: agent-team
      name: '@janhq/jan-agent-team'
      config:
        maxTasks: 256

    - id: tool-agent-team
      name: '@janhq/jan-tool-agent-team'

    - id: subagent-spawn-in-process
      name: '@janhq/jan-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: subagent-fork-in-process
      name: '@janhq/jan-subagent-fork-in-process'
      config:
        providerName: fork

    # Continuable background children are selected per delegation tool. The
    # separately loaded follow-up tool registers the one global `send_message`.
    - id: tool-subagent-control
      name: '@janhq/jan-tool-subagent-control'

    - id: tool-subagent
      name: '@janhq/jan-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        allowedAgentPresets: [scout, reviewer, worker]
        presetAgentOptions:
          scout: { provider: tokamak, model: 'anthropic/claude-haiku-5-5[1m]' }

    # Fork omits model-selection arguments for KV Cache reuse. Parent and child
    # share the messaging tools; return guidance follows the inherited history.
    # See packages/subagent/tool-subagent/README.md
    # and .agents/notes/implemented/architecture/2026-08-10-fork-children-stay-one-shot.md.
    - id: tool-subagent-fork
      name: '@janhq/jan-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork

    - id: ptc-runtime
      name: '@janhq/jan-ptc-runtime-node'

    - id: workflow-ptc
      name: '@janhq/jan-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@janhq/jan-tool-workflow'

    - id: timeout-policy
      name: '@janhq/jan-tool-call-timeout-policy'

    - id: spill-local
      name: '@janhq/jan-spill-local'

    - id: spill-policy
      name: '@janhq/jan-spill-policy'
      config:
        maxInlineTokens: 12500

    # Durability checkpoints before each model request and top-level dispatch.
    - id: session-checkpoint-policy
      name: '@janhq/jan-session-checkpoint-policy'

    # Compacts oversized tool results before the broader conversation compactor
    # runs, preserving the model-visible result within the configured budget.
    - id: tool-result-pruner
      name: '@janhq/jan-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    # When an image-capable route rejects a request as over its image budget,
    # replace the oldest images with placeholders on the surface and retry.
    - id: image-offload
      name: '@janhq/jan-compaction-image-offload'

    - id: tool-todo
      name: '@janhq/jan-tool-todo'
      config:
        allowParallelInProgress: true

    # Persisted same-session goals reach the model and the slash menu here; the
    # domain, driver, and `/goal` command are above.
    - id: tool-goal
      name: '@janhq/jan-tool-goal'

    # Consecutive-repeat reminders on the tool chain.
    - id: repeat-tool-reminder
      name: '@janhq/jan-repeat-tool-reminder'
      config:
        thresholds: [3, 5, 8]
        argumentsPreviewChars: 500

    # The shared base enables the stable model-facing web_search and web_fetch
    # tools. The Web app disables this host row and composes both tools per agent
    # preset; products with a stricter network policy override tool-web.
    # Anonymous fetch accepts only public HTTP(S) destinations, resolves and
    # validates every destination, and pins every actual connection. This
    # composition gives web_search 60s whichever provider serves it; the
    # provider-neutral tool default remains 30s. The Web search provider and Web
    # fetch provider menus on the Web search and fetch settings page select a
    # provider for each capability in place of these defaults.
    - id: web
      name: '@janhq/jan-web'
      config:
        # tokamak-harness: Tokamak search and fetch while the Tokamak account is
        # signed in; otherwise Exa search, keyless until EXA_API_KEY is set, and
        # pages fetched directly over HTTP.
        searchProvider: [tokamak, exa]
        fetchProvider: [tokamak, http]

    - id: web-fetch-http
      name: '@janhq/jan-web-fetch-http'

    # tokamak-harness: Tokamak, Exa, Tavily and You.com search and fetch
    # (`tokamak`, `exa`, `tavily`, `you`). Tokamak uses the signed-in account's key
    # on the deployment the tokamak-account row names; Exa and You.com are keyless
    # until EXA_API_KEY or YDC_API_KEY is set, Tavily needs TAVILY_API_KEY. Queries
    # go to the selected backend.
    - id: web-search
      name: '@janhq/jan-web-search'
      config:
        tokamak:
          apiUrl: !!js (process.env.TOKAMAK_BASE_URL || 'https://api.tokamak.sh/v1').trim().replace(/\/+$/, '').replace(/^(https?:\/\/[^/]+)$/, '$1/v1')

    - id: tool-web
      name: '@janhq/jan-tool-web'
      config:
        fetch: true
        searchTimeoutMs: 60000

    - id: mcp-resources
      name: '@janhq/jan-mcp-resources'

    # ── rows every mode mounts, whose values each overlay may state ──────────────

    # Shared tool definitions and the deployment’s native executor.
    - id: tools
      name: '@janhq/jan-tools'

    - id: tool-executor-native
      name: '@janhq/jan-tool-executor-native'

    - id: tool-executor-ptc
      name: '@janhq/jan-tool-executor-ptc'
      disabled: true

    # The deployment persona is a deployment choice; plan-mode and tool plugins own
    # their own prompt sections.
    - id: system-prompt
      name: '@janhq/jan-system-prompt'
      config:
        # tokamak-harness: the persona opener replaces the default harness identity sentence.
        includeHarnessIdentity: false
        personaPrefix: You are Jan, an AI agent.

    # Agents created at startup. The base stays empty; raw overlays may create
    # agents, while Web creates sessions on client request.
    - id: agent-loop
      name: '@janhq/jan-agent-loop'
      config:
        agents: []

    # The sandboxed filesystem provider. `cwd` defaults to `process.cwd()`; an
    # overlay can pin another workspace.
    - id: fs-sandbox
      name: '@janhq/jan-fs-sandbox'
