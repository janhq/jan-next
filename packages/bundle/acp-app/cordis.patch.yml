# The automation-only ACP application over dsh-base. Stdout belongs to ACP.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: acp-app-startup
      name: '@deepseek-ai/dsh-acp-app'

    - id: acp
      name: '@deepseek-ai/dsh-acp'
      inject: [acpAppStartup]
      config:
        # tokamak-harness: DeepSeek routes are unmounted; ACP uses the Tokamak route.
        provider: tokamak
        model: tokamak-1-preview

- id: hmr
  disabled: true
