# The automation-only ACP application over jan-base. Stdout belongs to ACP.

- id: system-prompt
  config:
    # tokamak-harness: the persona opener replaces the default harness identity sentence.
    includeHarnessIdentity: false
    personaPrefix: >-
      You are Jan, an AI agent. You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: acp-app-startup
      name: '@janhq/jan-acp-app'

    - id: acp
      name: '@janhq/jan-acp'
      inject: [acpAppStartup]
      config:
        provider: tokamak
        model: tokamak/auto

- id: hmr
  disabled: true
