# Standalone minimal SDK application. Unlike the ordinary SDK profile, this
# bundle does not layer over jan-base: this insert is the complete Cordis tree.
# User profile, home, and invocation patches still apply above it.

- insert:
    - id: sdk-app-startup
      name: '@janhq/jan-sdk-app'
      config:
        profile: sdk-minimal

    - id: sdk-jsonrpc-server
      name: '@janhq/jan-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: false

    # Tokamak router route; another deployment replaces baseURL through a profile patch.
    # Its models come from the router's GET {baseURL}/models listing.
    - id: llm-pi-ai
      name: '@janhq/jan-llm-pi-ai'
      config:
        providers:
          tokamak:
            displayName: Tokamak
            api: openai-completions
            baseURL: https://api.tokamak.sh/v1
            apiKeyEnv: TOKAMAK_API_KEY
            defaultContextWindow: !!js Number(process.env.JAN_CONTEXT_WINDOW ?? 200000)
            streamIdleTimeoutMs: 172800000
            modelListing:
              refreshIntervalMs: 600000
              timeoutMs: 15000
              preferredDefaults: [tokamak/auto]
              exclude: [openai/gpt-image-*]

    - id: sandbox
      name: '@janhq/jan-sandbox-local'

    # Shared projection registry: sandbox-policy and terminal-bash fold
    # sandbox-mode state through its units and require it as a hard injection.
    - id: filesystem
      name: '@janhq/jan-fs-local'

    - id: attachment-local
      name: '@janhq/jan-attachment-local'

    - id: tool-fs
      name: '@janhq/jan-tool-fs'
      config:
        read: false
        readImage: true
        write: false
        edit: false

    - id: working-directory
      name: '@janhq/jan-working-directory'

    - id: tool-working-directory
      name: '@janhq/jan-tool-working-directory'

    - id: session-projection
      name: '@janhq/jan-session-projection'

    - id: token-meter
      name: '@janhq/jan-token-meter'

    - id: compaction-basic
      name: '@janhq/jan-compaction-basic'

    - id: image-offload
      name: '@janhq/jan-compaction-image-offload'

    - id: sandbox-policy
      name: '@janhq/jan-sandbox-policy'
      config:
        mode: danger-full-access
        workspaceRoot: !!js process.cwd()

    - id: subprocess
      name: '@janhq/jan-subprocess-local'

    - id: pty
      name: '@janhq/jan-terminal'

    - id: terminal-bash
      name: '@janhq/jan-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: terminal-pwsh
      name: '@janhq/jan-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    # Keep the minimal agent kernel explicit: unlike jan-base, this profile
    # owns each service row and omits every optional producer it does not use.
    - id: timer
      name: '@janhq/cordis-plugin-timer'

    - id: llm
      name: '@janhq/jan-llm'

    - id: session
      name: '@janhq/jan-session'

    - id: session-title
      name: '@janhq/jan-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: system-prompt
      name: '@janhq/jan-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        personaPrefix: !!js process.env.JAN_SYSTEM_PROMPT ?? 'You are a helpful software engineer assistant.'

    - id: tools
      name: '@janhq/jan-tools'

    - id: tool-executor-native
      name: '@janhq/jan-tool-executor-native'

    - id: mcp-resources
      name: '@janhq/jan-mcp-resources'

    - id: agent
      name: '@janhq/jan-agent'


    - id: llm-retry
      name: '@janhq/jan-llm-retry'

    - id: jobs
      name: '@janhq/jan-jobs-local'

    - id: agent-loop
      name: '@janhq/jan-agent-loop'
      config:
        agents: []

    - id: persistent-bash
      name: '@janhq/jan-tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a bash shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * Network access depends on the task environment. Prefer configured mirrors/proxies when they are available.
          * State is persistent across command calls and discussions with the user.
          * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.

    - id: persistent-pwsh
      name: '@janhq/jan-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Run commands in a PowerShell shell
          * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
          * You don't have access to the internet via this tool.
          * State is persistent across command calls and discussions with the user.
          * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
          * Please avoid commands that may produce a very large amount of output.
          * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.

    - id: sessions
      name: '@janhq/jan-session-persistence-jsonl'
      config:
        root: !!js janHomePath('sessions')
        compression: none

    - id: session-checkpoint-policy
      name: '@janhq/jan-session-checkpoint-policy'
