# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@janhq/jan-system-prompt'

- id: fs
  name: '@janhq/jan-fs-local'

- id: session-projections
  name: '@janhq/jan-session-projection'

- id: working-directory
  name: '@janhq/jan-working-directory'

- id: tools
  name: '@janhq/jan-tools'

- id: tool-executor-native
  name: '@janhq/jan-tool-executor-native'

- id: subprocess
  name: '@janhq/jan-subprocess-local'

- id: bash
  name: '@janhq/jan-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@janhq/jan-shell-env'

- id: tasks
  name: '@janhq/jan-jobs-local'

- id: tool-jobs
  name: '@janhq/jan-tool-jobs'

- id: tool-pwsh
  name: '@janhq/jan-tool-pwsh'
