<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Hand: Tabler Icons `hand-stop` (MIT), the line language of Jan's sidebar.
       Used as a CSS mask, so the page paints it in the text colour. -->
  <style>
    /* Two swings from the wrist, then a rest, looped while the turn runs. */
    .hand { transform-origin: 12px 21px; animation: wave 2.4s cubic-bezier(0.77, 0, 0.175, 1) infinite; }
    .lines { animation: lines 2.4s ease infinite; }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      12% { transform: rotate(14deg); }
      26% { transform: rotate(-8deg); }
      40% { transform: rotate(10deg); }
      52% { transform: rotate(-3deg); }
    }
    @keyframes lines {
      0%, 60%, 100% { opacity: 0.35; }
      12%, 40% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .hand, .lines { animation: none; } }
  </style>
  <g class="lines">
    <path d="M19.5 2.5a4 4 0 0 1 2 3"/>
    <path d="M2.5 16.5a4 4 0 0 0 2 3"/>
  </g>
  <g class="hand" transform="translate(2.2 1.6) scale(0.84)">
    <path d="M8 13v-7.5a1.5 1.5 0 0 1 3 0v6.5"/>
    <path d="M11 5.5v-2a1.5 1.5 0 1 1 3 0v8.5"/>
    <path d="M14 5.5a1.5 1.5 0 0 1 3 0v6.5"/>
    <path d="M17 7.5a1.5 1.5 0 0 1 3 0v8.5a6 6 0 0 1 -6 6h-2h.208a6 6 0 0 1 -5.012 -2.7a69.74 69.74 0 0 1 -.196 -.3c-.312 -.479 -1.407 -2.388 -3.286 -5.728a1.5 1.5 0 0 1 .536 -2.022a1.867 1.867 0 0 1 2.28 .28l1.47 1.47"/>
  </g>
</svg>
