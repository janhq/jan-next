# Missing-credential patch over the shipped headless profile. The pi-ai
# `tokamak` route reads TOKAMAK_API_KEY but cannot reach its endpoint.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: tokamak
        model: tokamak-1-preview
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- id: llm-pi-ai
  config:
    providers:
      tokamak:
        displayName: Tokamak
        api: openai-completions
        apiKeyEnv: TOKAMAK_API_KEY
        baseURL: 'http://127.0.0.1:9'
        models:
          - id: tokamak-1-preview

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.JAN_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
