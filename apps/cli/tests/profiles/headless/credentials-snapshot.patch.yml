# Missing-credential patch over the shipped headless profile. The pi-ai
# `deepseek` route reads DEEPSEEK_API_KEY but cannot reach its endpoint.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek
        model: deepseek-flash
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- id: llm-pi-ai
  config:
    providers:
      deepseek:
        apiKeyEnv: DEEPSEEK_API_KEY
        baseURL: 'http://127.0.0.1:9'

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.JAN_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
