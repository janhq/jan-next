# Test-only agent and persistence patch over the shipped base + headless
# profile. The shared driver owns the turn, so the product runner stays off.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: tokamak
        model: tokamak-1-preview
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: !!js "process.env.JAN_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.JAN_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
