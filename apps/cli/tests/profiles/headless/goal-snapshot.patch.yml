# Replay-backed goal patch over the shipped headless profile.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: session-title-llm
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: tokamak-official
        model: tokamak-1-preview
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: tokamak-official

- id: sandbox-policy
  inject: []
  config:
    mode: !!js process.env.JAN_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()
