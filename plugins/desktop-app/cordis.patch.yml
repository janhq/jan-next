# The Jan desktop bundle patch, layered over jan-base and jan-web-app by the
# desktop profile template. Only the desktop app mounts these rows; the plain
# web profile keeps the stock shell.

# Desktop Search includes chat messages. Keep the index in the local Host's
# memory and build it on the first search, not at startup. The plain Web
# profile avoids the indexing cost and keeps content search opt-in.
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search

# The stock empty composer asks what to build; this is a chat app.
- id: ui-conversation
  config:
    heroPlaceholder: Ask anything, / for commands, @ for files or chats

- insert:
    # Jan's palette, sidebar, appearance settings and window controls.
    - id: jan-theme
      name: '@janhq/jan-client-ui-jan-theme'

    # Read-only import of chats from the earlier Jan desktop app.
    - id: jan-legacy-import
      name: '@janhq/jan-legacy-import'

    # Browse and install agent presets from the Preset Square gallery.
    - id: jan-preset-square
      name: '@janhq/jan-preset-square'

    # Every local model download in one page, opened from the More menu.
    - id: jan-downloads
      name: '@janhq/jan-downloads'

    # Find, download and start local models from Jan's model catalog; a sidebar row opens it.
    - id: jan-model-hub
      name: '@janhq/jan-model-hub'
