[package]
name = "jan-llama-worker"
# Tracks the pinned llama.cpp semantic version (build.rs LLAMA_CPP_VERSION).
version = "1.0.0"
description = "Supervised llama.cpp worker process serving OpenAI-compatible HTTP on loopback"
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "jan_llama_worker"
path = "src/lib.rs"

# `required-features` keeps the binary out of the default build, where there
# is no compiled llama.cpp to link against.
[[bin]]
name = "jan-llama-worker"
path = "src/main.rs"
required-features = ["engine"]
doc = false

[features]
default = []
# Compiles and statically links llama.cpp (libllama + libcommon +
# server-context) plus the C shim; ggml is built shared with runtime-loaded
# backend modules.
engine = []
# GPU backends. Each implies `engine`; each needs its own toolchain (nvcc, the
# Vulkan SDK, ROCm, Xcode).
engine-cuda = ["engine"]
engine-vulkan = ["engine"]
engine-hip = ["engine"]
engine-metal = ["engine"]

[dependencies]
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", features = ["signal"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tempfile = "3.0"

[build-dependencies]
cc = "1"
