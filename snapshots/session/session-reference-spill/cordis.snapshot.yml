# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js janHomePath('sessions')
    compression: none

- id: sandbox
  name: '@janhq/jan-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: tokamak-official
            name: Tokamak
            models:
              - id: tokamak-1-preview
              - id: tokamak-1-pro

- id: spill-local
  name: '@janhq/jan-spill-local'
  config:
    root: !!js process.env.JAN_SNAPSHOT_SPILL_ROOT ?? './.spill'
    cleanupPeriodDays: 0

- insert:
    - id: session-reference
      name: '@janhq/jan-session-reference'
      config:
        maxReferenceBytes: 360
    - id: reference-source-fixture
      name: ../../../packages/context/session-reference/tests/fixtures/source-session.ts

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.JAN_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.JAN_SNAPSHOT_SPILL_LOCATOR_ROOT
