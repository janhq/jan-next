# Minimal live counterpart for the glob-sampling snapshot composition.
- id: subprocess
  name: '@janhq/jan-subprocess-local'

- id: agent-default-model
  name: '@janhq/jan-agent-default-model'
  config:
    provider: tokamak-official
    model: tokamak-1-pro

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js janHomePath('sessions')
    compression: !!js 'process.env.JAN_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@janhq/jan-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@janhq/jan-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: tool-jobs
  name: '@janhq/jan-tool-jobs'
  disabled: true

- id: goal
  name: '@janhq/jan-goal'
  disabled: true

- id: goal-round-driver
  name: '@janhq/jan-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@janhq/jan-command-goal'
  disabled: true

- id: tool-goal
  name: '@janhq/jan-tool-goal'
  disabled: true

- id: skill
  name: '@janhq/jan-skill'
  disabled: true

- id: skill-filesystem
  name: '@janhq/jan-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@janhq/jan-tool-skill'
  disabled: true

- id: tool-fs-search
  name: '@janhq/jan-tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4

- id: spill-local
  name: '@janhq/jan-spill-local'
  config:
    root: !!js process.env.JAN_SNAPSHOT_SPILL_ROOT ?? './.spill'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.JAN_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.JAN_SNAPSHOT_SPILL_LOCATOR_ROOT
