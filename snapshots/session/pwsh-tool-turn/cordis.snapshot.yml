# Minimal keyless composition: real app, pwsh executor, and pwsh tool; replayed model.
- insert:
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro

- id: subprocess
  name: '@janhq/jan-subprocess-local'

- id: bash-sandbox
  name: '@janhq/jan-bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@janhq/jan-pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@janhq/jan-shell-env'

- id: agent-default-model
  name: '@janhq/jan-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js janHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@janhq/jan-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@janhq/jan-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: goal
  name: '@janhq/jan-goal'
  disabled: true

- id: goal-round-driver
  name: '@janhq/jan-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@janhq/jan-command-goal'
  disabled: true

- id: tool-goal
  name: '@janhq/jan-tool-goal'
  disabled: true

- id: skill
  name: '@janhq/jan-skill'
  disabled: true

- id: skill-filesystem
  name: '@janhq/jan-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@janhq/jan-tool-skill'
  disabled: true

- id: tool-bash
  name: '@janhq/jan-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@janhq/jan-tool-pwsh'
  disabled: false
