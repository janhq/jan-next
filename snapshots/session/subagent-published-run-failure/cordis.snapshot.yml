# Keyless counterpart to subagent-durability-failure.cordis.yml: replace the
# live adapter with replay and fail the provider-owned final child checkpoint.
- id: agent-default-model
  name: '@janhq/jan-agent-default-model'
  config:
    provider: tokamak-official
    model: tokamak-1-preview

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js janHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@janhq/jan-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@janhq/jan-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: sandbox
  name: '@janhq/jan-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: tokamak-official
            name: Tokamak
            models:
              - id: tokamak-1-preview
              - id: tokamak-1-pro
    - id: subagent-durability-failure
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/subagent-durability-failure.ts'
