- id: agent-default-model
  name: '@janhq/jan-agent-default-model'
  config:
    provider: tokamak-official
    model: tokamak-1-vision

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js janHomePath('sessions')
    compression: none

- id: tool-executor-native
  disabled: false

- id: tool-executor-ptc
  disabled: true

- id: system-prompt
  name: '@janhq/jan-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: tokamak-official
            name: Tokamak
            models:
              - id: tokamak-1-vision
                inputModalities: [text, image]

- id: attachment-local
  name: '@janhq/jan-attachment-local'

- insert:
    - id: computer-use
      name: '@janhq/jan-computer-use'
    - id: cua-native
      name: '@janhq/jan-experimental-cua-macos'
      config:
        agentPreset: false
        helperPath: !!js process.cwd() + '/native-helper.mjs'
        allowedApps: [{"id": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", "name": "Fixture", "executablePath": "/fixture/app"}]

- id: user-questions
  name: '@janhq/jan-user-questions'

- insert:
    - id: cua-permission-fixture
      name: './permission-fixture.mjs'
