# Keyless replay counterpart to pty.cordis.yml.
- insert:
    - id: pty
      name: '@janhq/jan-terminal'
    - id: pty-snapshot-backend
      name: './pty-snapshot-backend.mjs'
    - id: tool-terminal
      name: '@janhq/jan-tool-terminal'
      config:
        maxResultBytes: 64
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: tokamak-official
            name: Tokamak
            models:
              - id: tokamak-1-preview
              - id: tokamak-1-pro
