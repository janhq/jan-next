# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js janHomePath('sessions')
    compression: none

- id: sandbox
  name: '@janhq/jan-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: tokamak-official
            name: Tokamak
            models:
              - id: tokamak-1-preview
              - id: tokamak-1-pro
          - id: tokamak-messages
            name: Tokamak Messages
            models:
              - id: tokamak-1-preview
              - id: tokamak-1-pro

# Bound foreground preparation before any native process is allocated.
- id: subprocess
  disabled: true

- id: sandbox
  disabled: true

- insert:
    - id: pending-confinement-fixture
      name: '../../../packages/shell/bash-sandbox/tests/fixtures/pending-confinement.ts'
