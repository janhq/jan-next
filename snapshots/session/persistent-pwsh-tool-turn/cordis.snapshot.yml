# Keyless replay counterpart to persistent-pwsh.cordis.yml.
- insert:
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: tokamak-official
            name: Tokamak
            models:
              - id: tokamak-1-pro

- insert:
    - id: terminal
      name: '@janhq/jan-terminal'

- id: sandbox-policy
  name: '@janhq/jan-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@janhq/jan-subprocess-local'

- insert:
    - id: terminal-pwsh
      name: '@janhq/jan-terminal-bash'
      config:
        shellDialect: pwsh
        timeoutMs: 30000

- id: agent-default-model
  name: '@janhq/jan-agent-default-model'
  config:
    provider: tokamak-official
    model: tokamak-1-pro

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js janHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@janhq/jan-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@janhq/jan-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: tool-jobs
  name: '@janhq/jan-tool-jobs'
  disabled: true

- id: goal
  name: '@janhq/jan-goal'
  disabled: true

- id: goal-round-driver
  name: '@janhq/jan-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@janhq/jan-command-goal'
  disabled: true

- id: tool-goal
  name: '@janhq/jan-tool-goal'
  disabled: true

- id: skill
  name: '@janhq/jan-skill'
  disabled: true

- id: skill-filesystem
  name: '@janhq/jan-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@janhq/jan-tool-skill'
  disabled: true

- id: tool-bash
  name: '@janhq/jan-tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@janhq/jan-tool-pwsh-persistent'
