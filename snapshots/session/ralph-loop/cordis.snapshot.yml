# Keyless replay for the `ralph` composition. The shared replay patch in
# `text-turn/cordis.snapshot.yml` applies only to the `default` composition, so
# a sibling composition restates those swaps and adds its own rows.
- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js janHomePath('sessions')
    compression: none

- id: sandbox
  name: '@janhq/jan-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: tokamak-official
            name: Tokamak
            models:
              - id: tokamak-1-preview
              - id: tokamak-1-pro
          - id: tokamak-messages
            name: Tokamak Messages
            models:
              - id: tokamak-1-preview
              - id: tokamak-1-pro

- insert:
    - id: tool-ralph
      name: '@janhq/jan-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64
