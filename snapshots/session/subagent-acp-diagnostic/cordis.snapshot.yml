# Keyless twin of subagent-acp-diagnostic.cordis.yml: keep the real ACP child
# permission-denial path and replace only the external parent model adapter.
- insert:
    - id: acp-diagnostic-settlement-order
      name: './settlement-order.mjs'
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: tokamak-official
            name: Tokamak
            models:
              - id: tokamak-1-preview
              - id: tokamak-1-pro
    - id: subagent-acp-diagnostic
      name: '@janhq/jan-subagent-acp'
      config:
        providerName: acp-diagnostic
        command: !!js process.execPath
        args:
          - !!js "decodeURIComponent(new URL('../../../packages/subagent/subagent-acp/tests/mock-acp-server.ts', 'file://' + process.env.JAN_SNAPSHOT_FILE).pathname)"
        permission: reject
        env:
          MOCK_PERMISSION: '1'
          MOCK_TOOL_KIND: execute
    - id: tool-subagent-acp-diagnostic
      name: '@janhq/jan-tool-subagent'
      config:
        provider: acp-diagnostic
        toolName: subagent_acp
        maxDepth: provider-managed
