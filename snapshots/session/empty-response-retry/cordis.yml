# Retry-scenario overlay. The overlay changes no tool or prompt composition, so
# its scenarios share the default header class. Config patches replace whole
# plugin configs: the app patch re-pins the recorded flash model and restates
# its base fields. Re-recording needs a provider route whose `retryPolicy`
# matches the deterministic 1 ms zero-jitter policy in `cordis.snapshot.yml`.
- id: agent-default-model
  name: '@janhq/jan-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js janHomePath('sessions')
    compression: !!js 'process.env.JAN_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@janhq/jan-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@janhq/jan-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.
