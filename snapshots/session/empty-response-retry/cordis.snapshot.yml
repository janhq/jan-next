# Keyless replay for the retry overlay: insert `llm-replay` and give its
# provider a deterministic 1 ms zero-jitter retry policy so the durable
# `llm/retry` event (`delayMs`) and replay wall time stay reproducible. The app
# patch still restates its whole config for raw JSONL persistence and the
# recorded model.
- id: agent-default-model
  name: '@janhq/jan-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js janHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@janhq/jan-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@janhq/jan-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            retryPolicy:
              mode: normal
              maxRetries: 2
              backoff:
                initialDelayMs: 1
                maxDelayMs: 1
                jitterRatio: 0
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
