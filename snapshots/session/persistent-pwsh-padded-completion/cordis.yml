# Minimal live counterpart for the persistent-pwsh-padded-completion snapshot composition.
- id: sandbox-policy
  name: '@janhq/jan-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@janhq/jan-subprocess-local'

- insert:
    - id: terminal
      name: '@janhq/jan-terminal'

- insert:
    - id: padded-pwsh-backend
      name: './pwsh-snapshot-backend.mjs'

- id: agent-default-model
  name: '@janhq/jan-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js janHomePath('sessions')
    compression: !!js 'process.env.JAN_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@janhq/jan-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@janhq/jan-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: tool-jobs
  name: '@janhq/jan-tool-jobs'
  disabled: true

- id: goal
  name: '@janhq/jan-goal'
  disabled: true

- id: goal-round-driver
  name: '@janhq/jan-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@janhq/jan-command-goal'
  disabled: true

- id: tool-goal
  name: '@janhq/jan-tool-goal'
  disabled: true

- id: skill
  name: '@janhq/jan-skill'
  disabled: true

- id: skill-filesystem
  name: '@janhq/jan-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@janhq/jan-tool-skill'
  disabled: true

- id: tool-bash
  name: '@janhq/jan-tool-bash'
  disabled: true

- insert:
    - id: tool-pwsh-persistent
      name: '@janhq/jan-tool-pwsh-persistent'
