# Replay patch for the Claude Code mods composition: the default composition's
# replay delta plus the bridge and mods. The model script comes from the
# scenario's committed session JSONL.

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js janHomePath('sessions')
    compression: none

- id: sandbox
  name: '@janhq/jan-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: claude-code-mods
      name: '@janhq/jan-experimental-claude-code-mods'
    - id: workspace-changes
      name: '@janhq/jan-workspace-changes'
    - id: claude-code-mod-snapshot-guard
      name: './demo-mod.ts'
    - id: claude-code-mod-replay-theater
      name: '@janhq/jan-experimental-claude-code-mods/examples/replay-theater/index.ts'
    - id: claude-code-mod-token-weather
      name: '@janhq/jan-experimental-claude-code-mods/examples/token-weather/index.ts'
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: tokamak-official
            name: Tokamak
            models:
              # The live route's published facts, so replay reconstructs the recorded request header.
              - id: tokamak-1-preview
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
              - id: tokamak-1-pro
          - id: tokamak-messages
            name: Tokamak Messages
            models:
              - id: tokamak-1-preview
              - id: tokamak-1-pro
