- insert:
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: tokamak-official
            name: Tokamak
            models:
              - id: tokamak-1-preview
                contextWindow: 1000000
                defaultMaxTokens: 8192
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: high

- insert:
    - id: skill-office
      name: '@janhq/jan-skill-office'
      disabled: false
      config:
        assetRoot: !!js process.cwd() + '/office-skills'
        node: !!js process.cwd() + '/office-node'
        cli: !!js process.cwd() + '/render-cli.cjs'

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true
