# Native inspection, scoped PTC, then native subagents and workflow.
- id: agent-default-model
  name: '@janhq/jan-agent-default-model'
  config:
    provider: tokamak-official
    model: tokamak-1-preview

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js janHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@janhq/jan-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-executor-native
  disabled: false

- id: tool-executor-ptc
  disabled: true

- id: system-prompt
  name: '@janhq/jan-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@janhq/jan-cordis-host-runner'
    - id: cordis-inspect-providers
      name: '@janhq/jan-tool-cordis/host'
    - id: tool-cordis
      name: '@janhq/jan-tool-cordis'
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: tokamak-official
            name: Tokamak
            models:
              - id: tokamak-1-preview
              - id: tokamak-1-pro
    - id: advanced-toolchain-presentation
      name: './presentation.mjs'
