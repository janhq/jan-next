# Keyless replay counterpart: deterministic HTTP remains real; only the model
# adapter is replaced by replay.
- insert:
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: tokamak-official
            name: Tokamak
            models:
              - id: tokamak-1-preview
              - id: tokamak-1-pro

    - id: web-fetch-fixture
      name: './web-fetch-fixture-server.mjs'

- id: web
  name: '@janhq/jan-web'

- id: web-fetch-http
  name: '@janhq/jan-web-fetch-http'
  disabled: true

- id: tool-web
  name: '@janhq/jan-tool-web'
  config:
    search: false
