# Keyless session-query snapshot patch: replay plus the filesystem spill
# settings inherited by this scenario. The ACP row re-pins the recorded flash model.
- id: agent-default-model
  name: '@janhq/jan-agent-default-model'
  config:
    provider: tokamak-official
    model: tokamak-1-preview

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js janHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@janhq/jan-agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@janhq/jan-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: tokamak-official
            name: Tokamak
            models:
              - id: tokamak-1-preview
              - id: tokamak-1-pro

- id: spill-local
  name: '@janhq/jan-spill-local'
  config:
    root: !!js process.env.JAN_SNAPSHOT_SPILL_ROOT ?? './.spill'

- id: spill-policy
  name: '@janhq/jan-spill-policy'
  config:
    maxInlineTokens: 200

# Keyless counterpart to session-query.cordis.yml: the nested snapshot overlay
# supplies replay plus deterministic private spill storage and its byte limit.
- insert:
    - id: tool-session-query
      name: '@janhq/jan-tool-session-query'

- id: timeout-policy
  name: '@janhq/jan-tool-call-timeout-policy'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.JAN_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.JAN_SNAPSHOT_SPILL_LOCATOR_ROOT

- insert:
    - id: query-spill-verification-path
      name: ./resolve-spill-command.mjs
