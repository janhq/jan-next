# The template resolves through the credential store, which the headless profile disables.
- id: credentials
  disabled: false

- insert:
    - id: mcp-template-error
      name: '@janhq/jan-mcp-client'
      inject: [credentials]
      config:
        transport: streamable-http
        serverName: protected
        url: !!js process.env.JAN_MCP_DEMO_URL
        headers:
          Authorization: 'Bearer ${credential:JAN_MCP_TEMPLATE_TOKEN}'
        expandTemplates: true
        failOnStartupError: true
        reconnect:
          enabled: false
