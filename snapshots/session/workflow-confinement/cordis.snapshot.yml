# Replay the authored model turns through the shipped OS sandbox.
- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js janHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: tokamak-official
            name: Tokamak
            models:
              - id: tokamak-1-preview
              - id: tokamak-1-pro
