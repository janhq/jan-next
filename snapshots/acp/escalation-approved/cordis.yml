# ACP snapshot-record patch over the shipped `acp` profile. The jan
# launcher owns environment loading, plugin resolution, and process shutdown;
# stdout remains reserved for ACP JSON-RPC.

- id: sandbox-policy
  name: '@janhq/jan-sandbox-policy'
  config:
    mode: !!js "process.env.JAN_PERMISSION_MODE ?? (process.env.JAN_SNAPSHOT === undefined ? 'workspace-write' : 'danger-full-access')"
    workspaceRoot: !!js process.cwd()

- id: approval
  name: '@janhq/jan-user-approval'
  config:
    policy: !!js "(process.env.JAN_PERMISSION_MODE ?? (process.env.JAN_SNAPSHOT === undefined ? 'workspace-write' : 'danger-full-access')) === 'danger-full-access' ? 'never' : 'ask'"

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js process.env.JAN_SNAPSHOT_SESSIONS_ROOT ?? janHomePath('sessions')
    compression: !!js "process.env.JAN_SNAPSHOT === undefined ? 'zstd' : 'none'"

# Recording route: the Tokamak endpoint under the provider id the replay patch serves.
- id: llm-pi-ai
  name: '@janhq/jan-llm-pi-ai'
  config:
    providers:
      tokamak-official:
        displayName: Tokamak
        api: openai-completions
        baseURL: !!js process.env.TOKAMAK_BASE_URL || 'https://api.tokamak.sh/v1'
        apiKeyEnv: TOKAMAK_API_KEY
        models:
          - id: tokamak-1-preview
          - id: tokamak-1-pro
          - id: tokamak-1-vision
            input: [text, image]

- id: acp
  name: '@janhq/jan-acp'
  config:
    provider: tokamak-official
    model: tokamak-1-preview

- id: system-prompt
  name: '@janhq/jan-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: agent-instructions
  name: '@janhq/jan-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-subagent
  name: '@janhq/jan-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

# Fork preserves the parent model route and inherited conversation.
- id: tool-subagent-fork
  name: '@janhq/jan-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    maxDepth: 1

- id: fs-sandbox
  name: '@janhq/jan-fs-sandbox'
  config:
    cwd: !!js process.cwd()

- insert:
    - id: hooks-claude-code
      name: '@janhq/jan-hooks-claude-code'
      config:
        configPath: ./hooks.json

    - id: hooks-codex
      name: '@janhq/jan-hooks-codex'
      config:
        configPath: ./codex-hooks.json

# The recorded tool catalog includes the optional patch tool.
- id: tool-fs
  config:
    applyPatch: true
