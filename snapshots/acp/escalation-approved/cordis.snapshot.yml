# Replay-only patch layered after `cordis.yml`: replace the network adapter
# with recorded JSONL, pin the recorded top-level model, and keep persistence
# raw for fixture harvesting.

- id: llm-pi-ai
  name: '@janhq/jan-llm-pi-ai'
  disabled: true

- id: acp
  name: '@janhq/jan-acp'
  config:
    provider: tokamak-official
    model: tokamak-1-preview

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js process.env.JAN_SNAPSHOT_SESSIONS_ROOT ?? janHomePath('sessions')
    compression: none

- id: sandbox
  name: '@janhq/jan-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@janhq/jan-llm-replay'
      config:
        providers:
          - id: tokamak-official
            name: Tokamak
            models:
              - id: tokamak-1-preview
              - id: tokamak-1-pro

    - id: subagent-settlement-marker
      name: './subagent-settlement-marker.ts'

- insert:
    - id: snapshot-shell-path
      name: ../../../scripts/snapshot-shell-path.ts
      config:
        command: "printf 'escalated\\n' > /tmp/jan-escalated.txt && cat /tmp/jan-escalated.txt && rm /tmp/jan-escalated.txt"
        recordedPath: /tmp/jan-escalated.txt
        livePath: !!js process.env.JAN_SNAPSHOT_SPILL_ROOT + '/jan-escalated.txt'
