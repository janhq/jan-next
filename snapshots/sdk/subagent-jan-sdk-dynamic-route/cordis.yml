# SDK-profile patch for a deterministic parent model that selects a route for
# a separate SDK child runtime. Both runtimes persist their request headers.

- id: tool-subagent
  name: '@janhq/jan-tool-subagent'
  disabled: true

- id: sdk-jsonrpc-server
  name: '@janhq/jan-sdk-jsonrpc-server'
  disabled: true

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js janHomePath('sessions')
    compression: none

- insert:
    - id: mock-llm
      name: '../../../packages/subagent/subagent-jan-sdk/tests/fixtures/loader/mock-delegating-llm.ts'
      disabled: !!js process.env.JAN_SNAPSHOT !== 'record'

    - id: subagent-jan-sdk
      name: '@janhq/jan-subagent-jan-sdk'
      config:
        profile: sdk
        patches: !!js JSON.parse(process.env.JAN_TEST_CHILD_PATCHES ?? '[]')
        janHome: !!js process.env.JAN_TEST_CHILD_HOME
        provider: mock
        model: mock-routed
        env:
          JAN_TELEMETRY_DISABLED: '1'

    - id: subagent-model-selection-settings
      name: '@janhq/jan-tool-subagent/model-selection-settings'
      config:
        enabled: true
        allowedModels:
          - provider: mock
            model: mock-routed

    - id: tool-subagent-jan-sdk
      name: '../../../packages/subagent/subagent-jan-sdk/tests/fixtures/loader/scoped-tool-subagent.ts'
      config:
        provider: jan-sdk
        toolName: subagent
        agentOptions:
          maxTokens: 777
        maxDepth: 'provider-managed'

    - id: sdk-jsonrpc-server-dynamic-live
      name: '@janhq/jan-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      disabled: !!js process.env.JAN_SNAPSHOT !== 'record'
      config:
        maxTokensAsSuccess: true

- insert:
    - id: await-external-subagents
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/subagent-settlement-barrier.ts'
