# TypeScript SDK snapshot-record patch over `jan --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@janhq/jan-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: session-persistence-jsonl
  name: '@janhq/jan-session-persistence-jsonl'
  config:
    root: !!js janHomePath('sessions')
    compression: !!js "process.env.JAN_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@janhq/jan-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

# The process-local clock is deterministic; native timers remain live.
- insert:
    - id: snapshot-clock
      name: './clock.mjs'

- id: time-context
  config:
    timeZone: UTC

# The recorded tool catalog includes the optional patch tool.
- id: tool-fs
  config:
    applyPatch: true
