# Continuous session-title composition with the shipped all-prompts provider.
- insert:
    - id: session-title-provider
      name: '@janhq/jan-session-title-all-prompts-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 4096
        maxOutputTokens: 32
        timeoutMs: 5000
        provider: tokamak-official
        model: tokamak-1-preview
